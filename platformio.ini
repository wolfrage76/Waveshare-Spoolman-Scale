; ============================================================
;  One firmware, several boards. [env] holds everything they share; each
;  [env:<board>] below adds what is the board's own: its BOARD_* macro, the
;  folder under src/boards/ that is compiled for it, its PSRAM and the
;  libraries only it needs. The environment's name is the board's BOARD_ID.
;  See src/boards/board.h and BUILDING.md, "Adding a board".
; ============================================================
[platformio]
default_envs = wt32-sc01-plus

[env]
; Pinned. Unpinned, this resolved to whatever was newest at build time, both
; locally and in CI (which runs pip install --upgrade platformio). Three
; versions were installed side by side here (6.7.0, 6.9.0, 6.13.0), so the
; same commit could produce different binaries on different days.
; pioarduino 55.03.312-1 ships Arduino core 3.3.12 on ESP-IDF 5.5. Core 2.0.17
; (espressif32@6.13.0) crashed with WiFi and Bluetooth up together on this
; board, and gets no more updates. Needs PlatformIO 6.2 or newer.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; A panic prints its backtrace as raw addresses. The decoder turns them into
; file and line while the scale hangs on USB, which is the difference between
; "PANIC" and knowing where. Costs nothing at build time.
monitor_filters = esp32_exception_decoder, time
monitor_speed = 115200

; Flash & Partition
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; Custom Fonts automatisch kopieren
extra_scripts =
    pre:lvgl_speed.py
    post:copy_release.py

; Libraries every board uses. SD, SPI, Preferences, WiFiClientSecure are part
; of the ESP32 framework.
lib_deps =
    lvgl/lvgl@8.3.11
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit NAU7802 Library@1.0.8
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.1

[common]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH=../../../../src/lv_conf.h

; Every folder under src/boards/ is left out here, and each environment adds
; its own back.
src_filter = +<*> -<boards/*/>

; The ESP-IDF options the precompiled core does not have. Building with them
; rebuilds the core once (about 4 minutes), later builds are normal.
; The board definition knows no PSRAM, so it is switched on here; whether it
; is Quad or Octal is the board's and stands in its environment. The rest
; keeps internal RAM for what only internal RAM can hold:
; WiFi and lwIP buffers may come from PSRAM, TLS and the NimBLE host allocate
; from PSRAM, the esp_timer stack is 4 kB, and drivers for hardware this board
; does not use keep their interrupt handlers out of IRAM. TLS then costs no
; internal RAM at all: an update check left it at 149 -> 151 kB, where core 2
; dropped by 40 kB (25.09.2026).
; The instruction cache is 32 kB instead of 16, for 16 kB of internal RAM:
; LVGL's drawing code no longer fights the rest of the loop for it. Measured
; with the render bench (02.10.2026): a scrolled list frame 54.0 -> 40.6 ms.
; A 64 kB data cache was measured too and drew no faster, so it stays at 32.
; A line that is removed stays in sdkconfig.<env>: switch it off explicitly.
sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_ESP32S3_SPIRAM_SUPPORT=y
    CONFIG_SPIRAM_TYPE_AUTO=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
    CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    '# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set'
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    '# CONFIG_RMT_TX_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_RMT_RX_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_RMT_ENCODER_FUNC_IN_IRAM is not set'
    '# CONFIG_MCPWM_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_I2S_ISR_IRAM_SAFE is not set'
    '# CONFIG_SPI_SLAVE_ISR_IN_IRAM is not set'
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
    '# CONFIG_ESP32S3_INSTRUCTION_CACHE_16KB is not set'
    CONFIG_ESP32S3_DATA_CACHE_32KB=y
    '# CONFIG_ESP32S3_DATA_CACHE_64KB is not set'

; ------------------------------------------------------------
;  WT32-SC01 Plus: 480x320 ST7796 on a parallel bus, FT6336U touch.
; ------------------------------------------------------------
[env:wt32-sc01-plus]
; PSRAM - Quad (nicht OPI, nicht Disabled)
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${common.build_flags}
    -DBOARD_WT32_SC01_PLUS
build_src_filter = ${common.src_filter} +<boards/wt32_sc01_plus/>
custom_sdkconfig =
    ${common.sdkconfig}
    CONFIG_SPIRAM_MODE_QUAD=y
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.27

; ------------------------------------------------------------
;  Waveshare ESP32-S3-Touch-LCD-7: 800x480 RGB panel, GT911 touch, CH422G
;  expander. The panel and the touch chip are driven by this firmware's own
;  code and ESP-IDF's RGB driver, so it needs no display library.
; ------------------------------------------------------------
[env:waveshare-s3-lcd7]
; PSRAM - Octal, 8 MB (ESP32-S3-WROOM-1-N16R8)
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_WAVESHARE_S3_LCD7
build_src_filter = ${common.src_filter} +<boards/waveshare_s3_lcd7/>
; Not CONFIG_LCD_RGB_ISR_IRAM_SAFE, although it reads like the thing to have.
; It lets the panel's refresh interrupt run while the flash is being written,
; and that interrupt copies from the frame buffer in PSRAM, which cannot be
; read at exactly that moment: the first log line written to flash ended in a
; cache error and a restart (10.10.2026). Without it the interrupt waits the
; few milliseconds and one of its turns is lost.
;
; CONFIG_LCD_RGB_RESTART_IN_VSYNC is switched off for what happens then. On,
; the driver restarts the transfer at every frame and never counts its
; interrupts, so after one lost turn its two buffers have swapped places for
; good: the picture sat ten lines too high, wrapped around at the bottom, with
; pieces of the lines above scattered along the left edge, until the next
; restart (10.10.2026). Off, the driver counts the turns of every frame and
; starts over cleanly when one is missing: a flicker for one frame.
; The firmware is copied into PSRAM at boot and runs from there (XIP), for 3.2
; of the 8 MB. A flash write then no longer switches the cache off, which is
; what kept the refresh interrupt waiting: every tap writes a log line, and
; every log line was a slice of the frame late and a flicker (11.10.2026).
;
; The data cache loads 64 bytes at a miss instead of 32. The panel's frame is
; copied out of PSRAM through that cache the whole time, and with the short
; line the copy did not keep up with the glass, see boards/.../panel.cpp.
custom_sdkconfig =
    ${common.sdkconfig}
    CONFIG_SPIRAM_MODE_OCT=y
    '# CONFIG_SPIRAM_MODE_QUAD is not set'
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
    '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set'
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y

; ------------------------------------------------------------
;  Guition JC3248W535C: 320x480 AXS15231B on quad SPI, touch on I2C,
;  PWM backlight. The panel is driven by this firmware's own code.
;  The SD card uses HSPI, which sd_logger.cpp already asks for, so the
;  panel takes SPI2.
; ------------------------------------------------------------
[env:guition-jc3248w535c]
; PSRAM - Octal, 8 MB (ESP32-S3-WROOM-1-N16R8)
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_GUITION_JC3248W535C
build_src_filter = ${common.src_filter} +<boards/guition_jc3248w535c/>
custom_sdkconfig =
    ${common.sdkconfig}
    CONFIG_SPIRAM_MODE_OCT=y
    '# CONFIG_SPIRAM_MODE_QUAD is not set'
