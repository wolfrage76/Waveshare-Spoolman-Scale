name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Every board but the one in the matrix below, separated by blanks. This is
    # the only place in this file that names them: a new board is one more
    # name here, one in the matrix of ci.yml, and a manifest-<board>.json for
    # the web flasher. scripts/check.sh refuses a board that is in
    # platformio.ini and missing in either workflow.
    env:
      OTHER_BOARDS: waveshare-s3-lcd7 guition-jc3248w535c
    strategy:
      matrix:
        env: [wt32-sc01-plus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots (partitions.csv). Since
        # v0.8.3 the firmware may outgrow the 3 MB slots of scales flashed
        # before that: such a scale reads the size from version.json, offers
        # the web flasher instead of the update, and moves to the new table
        # over USB once. More than 6 MB fits no device at all.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Read version from app_config.h
        id: version
        run: |
          # FW_VERSION moved out of main.cpp into app_config.h during the
          # refactor. The old grep silently returned an empty string, which
          # would have produced a release named "SpoolmanScale " with an empty
          # version in manifest.json instead of failing.
          VERSION=$(grep '#define FW_VERSION' src/app_config.h | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::FW_VERSION not found in src/app_config.h"
            exit 1
          fi
          # Only on a tag push. A manual workflow_dispatch run has a branch
          # name in GITHUB_REF_NAME and must not be held to this.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FW_VERSION $VERSION"
            exit 1
          fi
          echo "Building $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Take what is published from main
        # version.json is written to main by this workflow and nowhere else, so
        # main has the current one. The tagged commit has whatever it branched
        # off with: comparing against that lets an old tag through, and writing
        # it back took a newer entry off main again. From here on the file in
        # the working tree is main's.
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:version.json 2>/dev/null; then
            git show FETCH_HEAD:version.json > version.json
            echo "version.json taken from main:"
            cat version.json
          else
            echo "main has no version.json yet"
          fi
      - name: Refuse a tag that is not newer than what is published
        if: github.ref_type == 'tag'
        run: |
          # The check above only compares the tag against FW_VERSION, so two
          # matching but too low numbers pass it. Since the firmware now
          # compares itself against version.json, a tag ranking below the
          # published one would put a red dot on every device and offer them a
          # downgrade. The ranking must stay identical to
          # src/services/version_compare.cpp.
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, re, sys

          def rank(v):
              if not v:
                  return -1
              m = re.search(r"(\d+)\.(\d+)\.(\d+)", v)
              if not m:
                  return -1
              major, minor, patch = (int(g) for g in m.groups())
              beta = 999                  # no "beta" in the tag: final release
              b = v.find("beta")
              if b != -1:
                  beta = 0                # "-beta": the public release
                  m2 = re.match(r"\.(\d+)", v[b + 4:])
                  # A counter only from 1 to 998, as version_compare.cpp:
                  # 999 would rank with a final release.
                  if m2 and 0 < int(m2.group(1)) <= 998:
                      beta = int(m2.group(1))
              # This fork's own counter, "-w1" at the very end: a release of
              # its own between two of upstream's. The lightest part, so it
              # only decides between tags that are the same version otherwise.
              fork = 0
              m3 = re.search(r"-w(\d+)$", v)
              if m3 and int(m3.group(1)) <= 999:
                  fork = int(m3.group(1))
              return (major * 10**9 + minor * 10**6 + patch * 10**3 + beta) * 1000 + fork

          tag = sys.argv[1]
          try:
              with open("version.json") as f:
                  data = json.load(f)
          except FileNotFoundError:
              print("no version.json yet, nothing to compare against")
              sys.exit(0)

          published = max((data.get("stable") or "", data.get("prerelease") or ""),
                          key=rank)
          if rank(tag) <= rank(published):
              print(f"::error::Tag {tag} does not rank above the published "
                    f"{published}. Every device would be offered a downgrade.")
              sys.exit(1)
          print(f"{tag} ranks above {published}, ok")
          PY
      - name: Prepare release assets
        run: |
          # Always, for both kinds of tag. The device downloads
          # releases/download/<tag>/SpoolmanScale.bin, so every release needs an
          # asset under that exact name - and it has to be the binary just
          # built, not whatever webflasher/ happens to hold from the last public
          # release.
          VERSION=${{ steps.version.outputs.version }}
          cp .pio/build/${{ matrix.env }}/firmware.bin SpoolmanScale.bin
          cp .pio/build/${{ matrix.env }}/firmware.bin SpoolmanScale_${VERSION}.bin
      - name: Build the other boards
        # The matrix above is the board whose files the fleet and the web
        # flasher know by their plain names. Every other board is built here,
        # in the same job, because the steps below publish once for all of
        # them. Each gets three assets under its own name:
        #   SpoolmanScale-<board>.bin                    what the device downloads
        #   SpoolmanScale-<board>_<version>.bin          for the browser upload
        #   SpoolmanScale-<board>_<version>_factory.bin  bootloader, partition
        #     table and firmware in one file, to flash at offset 0 over USB
        # A new board is one more name in OTHER_BOARDS at the top of the job.
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for BOARD in $OTHER_BOARDS; do
            pio run -e "$BOARD"
            OUT=".pio/build/$BOARD"
            SIZE=$(stat -c %s "$OUT/firmware.bin")
            echo "$BOARD firmware.bin: $SIZE bytes of 6291456"
            if [ "$SIZE" -gt 6291456 ]; then
              echo "::error::$BOARD firmware.bin is $SIZE bytes, more than the 6 MB app slot"
              exit 1
            fi
            cp "$OUT/firmware.bin" "SpoolmanScale-$BOARD.bin"
            cp "$OUT/firmware.bin" "SpoolmanScale-${BOARD}_${VERSION}.bin"
            # The build has already put the four parts into one file. Merging
            # them here with esptool failed on the runner, whose own Python
            # lacks a module that tool imports.
            if [ ! -s "$OUT/firmware.factory.bin" ]; then
              echo "::error::$BOARD: the build left no firmware.factory.bin"
              exit 1
            fi
            cp "$OUT/firmware.factory.bin" "SpoolmanScale-${BOARD}_${VERSION}_factory.bin"
          done
      - name: Update the public web flasher
        # Public tags only. An internal beta.N build would otherwise switch the
        # flasher to a test version that nobody outside the test should be
        # offered, and every release would add each board's image, over 3 MB a
        # piece, to the history of main.
        if: "!contains(github.ref_name, '-beta.')"
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Every board is flashed with the same bootloader, partition table
          # and otadata, kept once in webflasher/. Only the firmware is its
          # own. A board that stops sharing them must get its own files and
          # its own paths in manifest-<board>.json before it is released.
          for BOARD in $OTHER_BOARDS; do
            for PART in bootloader.bin partitions.bin; do
              if ! cmp -s ".pio/build/${{ matrix.env }}/$PART" ".pio/build/$BOARD/$PART"; then
                echo "::error::$BOARD has its own $PART, the web flasher shares one between the boards"
                exit 1
              fi
            done
            cp "SpoolmanScale-$BOARD.bin" "webflasher/SpoolmanScale-$BOARD.bin"
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" "manifest-$BOARD.json"
          done
          cp .pio/build/${{ matrix.env }}/bootloader.bin webflasher/bootloader.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin  webflasher/partitions.bin
          # otadata, blank: boots app0 after a flash. Without it a device that
          # last ran from app1 keeps booting the old firmware from there.
          cp "$(find ~/.platformio/packages -path '*framework-arduinoespressif32*' -name boot_app0.bin | head -1)" webflasher/boot_app0.bin
          cp .pio/build/${{ matrix.env }}/firmware.bin    webflasher/SpoolmanScale.bin
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.json
          # The whole suffix is optional, in both directions. Without the
          # counter group a second beta.N in a row matched only the prefix and
          # produced "v0.6.3-beta.14.13"; without making "-beta" itself optional
          # the line would stop matching for good after the first suffix-free
          # release and index.html would freeze at that version.
          sed -i -E "s/Firmware v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?(-w[0-9]+)?/Firmware $VERSION/" index.html
      - name: Update version.json
        run: |
          # Read by the firmware's background update check. Deliberately a
          # static file on Pages rather than api.github.com: that API allows
          # 60 requests per hour and IP, which users behind carrier grade NAT
          # share, and its release list runs to over a hundred kilobytes.
          #
          # This fork's own counter at the end (v0.6.0-beta.3-w1) changes
          # nothing about which kind of tag it is.
          # A tag carrying a beta counter (v0.6.0-beta.3) is an internal build
          # and only ever lands in "prerelease". A public tag (v0.6.0-beta)
          # updates both, so devices with pre-releases switched off see it too.
          #
          # The checksum of the image goes next to the tag. The device sums
          # the download as it writes it and refuses to commit on a mismatch,
          # so a corrupt or foreign image cannot be booted - TLS covers the
          # path, this covers the bytes.
          VERSION=${{ steps.version.outputs.version }}
          SHA=$(sha256sum SpoolmanScale.bin | cut -d' ' -f1)
          # The size too: a device on the old 3 MB partition table compares it
          # with its app slot and offers the web flasher instead of an update
          # that would not fit. Firmware from before this ignores the key.
          SIZE=$(stat -c%s SpoolmanScale.bin)
          # Every other board has the same keys in an object of its own under
          # "boards", which is where its firmware looks (BOARD_VERSION_NODE).
          python3 - "$VERSION" "$SHA" "$SIZE" $OTHER_BOARDS <<'PY'
          import hashlib, json, os, re, sys
          version, sha, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          other_boards = sys.argv[4:]
          data = {
              "stable": "",
              "stable_sha256": "",
              "prerelease": "",
              "prerelease_sha256": "",
              "url": "https://github.com/wolfrage76/Waveshare-Spoolman-Scale/releases/latest",
          }
          try:
              with open("version.json") as f:
                  data.update(json.load(f))
          except FileNotFoundError:
              pass
          data["prerelease"] = version
          data["prerelease_sha256"] = sha
          data["prerelease_size"] = size
          if not re.search(r"-beta\.\d+(-w\d+)?$", version):
              data["stable"] = version
              data["stable_sha256"] = sha
              data["stable_size"] = size
          boards = data.setdefault("boards", {})
          for board in other_boards:
              image = f"SpoolmanScale-{board}.bin"
              with open(image, "rb") as f:
                  board_sha = hashlib.sha256(f.read()).hexdigest()
              board_size = os.path.getsize(image)
              node = boards.setdefault(board, {})
              node["prerelease"] = version
              node["prerelease_sha256"] = board_sha
              node["prerelease_size"] = board_size
              if not re.search(r"-beta\.\d+(-w\d+)?$", version):
                  node["stable"] = version
                  node["stable_sha256"] = board_sha
                  node["stable_size"] = board_size
          with open("version.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print("version.json:", data)
          PY
      - name: Publish the changed files to main
        run: |
          # GitHub Pages serves version.json, index.html, manifest.json and
          # webflasher/ from main, so the files have to land there - but only
          # the files.
          #
          # This used to be "git pull origin main --rebase" followed by
          # "git push origin HEAD:main". The checkout sits on the tagged commit,
          # so tagging any branch other than main pushed that branch's entire
          # history onto main as a fast-forward. Tagging dev would have merged
          # dev into main as a side effect of cutting a release.
          #
          # Instead: carry the generated files aside, check out main, put them
          # back, and commit there. One commit, only the intended files, no
          # foreign history.
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p /tmp/ci-out/webflasher
          cp version.json /tmp/ci-out/
          if [ -z "$(echo "$VERSION" | grep -E -- '-beta\.[0-9]+(-w[0-9]+)?$')" ]; then
            cp manifest.json manifest-*.json index.html /tmp/ci-out/
            cp webflasher/bootloader.bin webflasher/partitions.bin webflasher/boot_app0.bin webflasher/SpoolmanScale.bin webflasher/SpoolmanScale-*.bin /tmp/ci-out/webflasher/
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # -f discards the working tree, which by now holds a rewritten
          # version.json. Without it the checkout refuses whenever that file
          # differs between the tagged commit and main - which is exactly what
          # happens as soon as a previous release has advanced main without the
          # tagged branch following. Everything worth keeping is in /tmp/ci-out
          # at this point.
          git checkout -f -B ci-main origin/main

          cp /tmp/ci-out/version.json version.json
          git add version.json
          if [ -f /tmp/ci-out/manifest.json ]; then
            cp /tmp/ci-out/manifest*.json .
            cp /tmp/ci-out/index.html index.html
            cp /tmp/ci-out/webflasher/*.bin webflasher/
            # -f: .gitignore lists what the repository carries, and a new
            # board's manifest is not on that list.
            git add -f manifest.json manifest-*.json index.html webflasher/*.bin
          fi

          git diff --cached --quiet || git commit -m "CI: publish $VERSION"
          git push origin ci-main:main
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpoolmanScale ${{ steps.version.outputs.version }}
          # Only internal builds carrying a beta counter are pre-releases.
          # A public tag has to become the real "latest", because the update
          # button downloads from releases/latest/download/ and that path skips
          # pre-releases. Marked wrong, the device would announce the new
          # version and then install the previous binary.
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          files: |
            SpoolmanScale.bin
            SpoolmanScale_${{ steps.version.outputs.version }}.bin
            SpoolmanScale-*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
