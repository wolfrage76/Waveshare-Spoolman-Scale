name: Feature request
description: An idea for this fork - another board, the AMS board, the web flasher
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This fork adds boards and what a larger panel makes possible. An idea for the scale itself,
        its screens or its web interface, is better placed with the
        [original project](https://github.com/Niko11111/SpoolmanScale/issues): it then reaches every board.
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Waveshare ESP32-S3-Touch-LCD-7
        - Waveshare ESP32-S3-Touch-LCD-4.3B
        - WT32-SC01 Plus
        - Another board
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
      description: Describe the situation at your printer or shelf, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Sketches and photos welcome.
  - type: dropdown
    id: backend
    attributes:
      label: Backend you use
      multiple: true
      options:
        - Spoolman
        - FilaMan
        - BamBuddy
        - Any / not backend specific
  - type: checkboxes
    id: implement
    attributes:
      label: Contributing
      options:
        - label: I would like to implement this myself (please wait for an OK before you start, see CONTRIBUTING)
