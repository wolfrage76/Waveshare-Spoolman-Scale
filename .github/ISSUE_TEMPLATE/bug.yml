name: Bug report
description: Something on the scale or in its web interface does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A log of the moment it happened is the fastest way to a fix.

        This is the tracker of **Waveshare Spoolman Scale**, a fork of
        [Niko11111/SpoolmanScale](https://github.com/Niko11111/SpoolmanScale). It is the right place
        for the Waveshare board, the AMS board, the web flasher of this fork and its releases.
        Something that happens the same way on the original firmware belongs to the
        [original project](https://github.com/Niko11111/SpoolmanScale/issues).

        Setup questions are often answered quicker in the original project's
        [manual](https://niko11111.github.io/SpoolmanScale-Docs/), which describes the WT32-SC01 Plus;
        what is different on the Waveshare board is in
        [BUILDING.md](https://github.com/wolfrage76/Waveshare-Spoolman-Scale/blob/main/BUILDING.md#other-boards).
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown on the info screen and at the top of every web page, e.g. v0.8.3-beta.51
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Waveshare ESP32-S3-Touch-LCD-7
        - Waveshare ESP32-S3-Touch-LCD-4.3B
        - WT32-SC01 Plus
        - Another board
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Where the firmware came from
      options:
        - This fork's web flasher
        - This fork's Releases page
        - Updated on the scale itself
        - Built from source
        - The original project
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Spoolman
        - FilaMan
        - BamBuddy (inventory in BamBuddy)
        - BamBuddy (inventory in Spoolman behind BamBuddy)
        - None / not set up yet
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Scale / weighing
        - NFC tag reading or writing
        - Display / touch
        - Wi-Fi / connection to the server
        - Web interface
        - Firmware update
        - AMS / 3D printer
        - AMS board (the page at the panel's full size)
        - Web flasher / first flash
        - Label printer
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Step by step, so it can be reproduced. A photo of the screen helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        From the web interface (page Logs) or the serial monitor at 115200 baud.
        Please cover the moment the problem happened.
      render: text
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Restart, other tag, other spool, other Wi-Fi ... and what changed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I checked the open issues for the same problem
          required: true
        - label: It is about this fork, not something the original firmware does the same way
          required: true
